<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - SlimeManMillerVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #5f9f55;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* GAME AREA */
        .game {
            position: relative;
            width: 100vw;
            height: 85vh;
            background: #5f9f55;
            overflow: hidden;
        }

        /* PLAYER */
        .player {
            position: absolute;
            left: 100px;
            top: 50%;
            width: 60px;
            height: 60px;
            background: #4f5551;
            transform: translateY(-50%);
        }

        /* GREEN BOXES */
        .enemy {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #8fd18a;
        }

        /* YELLOW BULLETS */
        .bullet {
            position: absolute;
            width: 35px;
            height: 12px;
            background: #ffd900;
        }

        /* CONTROLS */
        .controls {
            position: relative;
            height: 15vh;
            background: #286b32;
        }

        /* EMPTY SHOOT BUTTON */
        .shoot-button {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            width: 220px;
            height: 80px;

            border: none;
            border-radius: 15px;

            background: #4f5a52;
            cursor: pointer;
        }

        .shoot-button:hover {
            background: #5d6961;
        }

        .shoot-button:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* BACK BUTTON */
        .back-button {
            position: absolute;
            left: 20px;
            bottom: 20px;

            width: 150px;
            height: 60px;

            background: #4f5a52;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;

            cursor: pointer;
            transition: transform 0.2s, background 0.2s;

            z-index: 10;
        }

        .back-button:hover {
            transform: scale(1.05);
            background: #5d6961;
        }
    </style>
</head>

<body>

    <!-- GAME -->
    <div class="game" id="game">

        <!-- PLAYER -->
        <div class="player" id="player"></div>

    </div>

    <!-- CONTROLS -->
    <div class="controls">

        <!-- EMPTY SHOOT BUTTON -->
        <button
            class="shoot-button"
            onclick="shoot()"
        ></button>

        <!-- BACK -->
        <a
            class="back-button"
            href="index.html"
        >
            BACK
        </a>

    </div>

    <script>

        const game = document.getElementById("game");

        let enemies = [];
        let bullets = [];

        /* CREATE GREEN BOX */
        function createEnemy() {

            const enemy = document.createElement("div");

            enemy.classList.add("enemy");

            const centerY =
                (game.clientHeight / 2) - 25;

            enemy.style.left =
                game.clientWidth + "px";

            enemy.style.top =
                centerY + "px";

            game.appendChild(enemy);

            enemies.push({
                element: enemy,
                x: game.clientWidth,
                y: centerY
            });
        }

        /* SHOOT */
        function shoot() {

            const bullet = document.createElement("div");

            bullet.classList.add("bullet");

            const playerX = 100 + 60;

            bullet.style.left =
                playerX + "px";

            bullet.style.top =
                (game.clientHeight / 2 - 6) + "px";

            game.appendChild(bullet);

            bullets.push({
                element: bullet,
                x: playerX,
                y: game.clientHeight / 2 - 6
            });
        }

        /* GAME LOOP */
        function gameLoop() {

            /* MOVE GREEN BOXES LEFT */
            enemies.forEach((enemy, index) => {

                enemy.x -= 4;

                enemy.element.style.left =
                    enemy.x + "px";

                /* REMOVE AT LEFT */
                if (enemy.x < -60) {

                    enemy.element.remove();

                    enemies.splice(index, 1);
                }
            });

            /* MOVE YELLOW BULLETS RIGHT */
            bullets.forEach((bullet, index) => {

                bullet.x += 8;

                bullet.element.style.left =
                    bullet.x + "px";

                /* REMOVE AT RIGHT */
                if (bullet.x > game.clientWidth) {

                    bullet.element.remove();

                    bullets.splice(index, 1);
                }
            });

            /* COLLISIONS */
            for (let b = bullets.length - 1; b >= 0; b--) {

                for (let e = enemies.length - 1; e >= 0; e--) {

                    const bulletRect =
                        bullets[b].element.getBoundingClientRect();

                    const enemyRect =
                        enemies[e].element.getBoundingClientRect();

                    if (
                        bulletRect.left < enemyRect.right &&
                        bulletRect.right > enemyRect.left &&
                        bulletRect.top < enemyRect.bottom &&
                        bulletRect.bottom > enemyRect.top
                    ) {

                        /* DELETE GREEN BOX */
                        enemies[e].element.remove();

                        /* DELETE BULLET */
                        bullets[b].element.remove();

                        enemies.splice(e, 1);
                        bullets.splice(b, 1);

                        break;
                    }
                }
            }

            requestAnimationFrame(gameLoop);
        }

        /* SPAWN GREEN BOXES */
        setInterval(() => {
            createEnemy();
        }, 1000);

        /* START */
        gameLoop();

    </script>

</body>
</html>
