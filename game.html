<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - SlimeManMillerVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 105%;
        }

        body {
            margin: 0;
            min-height: 105vh;
            background: #5f9f55;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* GAME AREA */
        .game {
            position: relative;
            width: 100vw;
            height: 85vh;
            background: #4f8748;
            overflow: hidden;
        }

        /* PLAYER */
        .player {
            position: absolute;
            left: 100px;
            top: 50%;
            width: 60px;
            height: 60px;
            background: #777d79;
            transform: translateY(-50%);
        }

        /* GREEN BOXES */
        .enemy {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #8fd18a;
        }

        /* YELLOW BULLETS */
        .bullet {
            position: absolute;
            width: 35px;
            height: 12px;
            background: #ffd900;
        }

        /* CONTROLS */
        .controls {
            position: relative;
            height: 15vh;
            background: #286b32;
        }

        /* EMPTY SHOOT BUTTON */
        .shoot-button {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);

            width: 220px;
            height: 80px;

            border: none;
            border-radius: 15px;

            background: #4f5a52;
            cursor: pointer;
        }

        .shoot-button:hover {
            background: #5d6961;
        }

        .shoot-button:active {
            transform: translate(-50%, -50%) scale(0.95);
        }

        /* BACK BUTTON */
        .back-button {
            position: absolute;
            left: 10px;
            bottom: 10px;

            width: 150px;
            height: 60px;

            background: #4f5a52;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;

            cursor: pointer;
            transition: transform 0.2s, background 0.2s;

            z-index: 30;
        }

        .back-button:hover {
            transform: scale(1.05);
            background: #5d6961;
        }

        /* MENU */
        .menu {
            position: absolute;
            inset: 0;

            background: rgba(20, 35, 20, 0.55);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            z-index: 20;
        }

        /* GAME OVER MENU */
        .game-over {
            background: rgba(10, 15, 10, 0.78);
        }

        .menu-title {
            color: black;
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        /* GAME OVER TEXT */
        .game-over .menu-title {
            color: black;
        }

        /* START / RESTART */
        .start-button {
            width: 280px;
            height: 120px;

            background: #4f5a52;
            border: none;
            border-radius: 15px;

            color: white;
            font-size: 32px;
            font-weight: bold;

            cursor: pointer;
        }

        .start-button:hover {
            background: #5d6961;
            transform: scale(1.05);
        }

        /* HIDDEN */
        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <!-- GAME -->
    <div class="game" id="game">

        <!-- PLAYER -->
        <div class="player" id="player"></div>

        <!-- MENU -->
        <div class="menu" id="menu">

            <div class="menu-title" id="menuTitle">
                GAME
            </div>

            <button
                class="start-button"
                id="startButton"
                onclick="startGame()"
            >
                START
            </button>

        </div>

    </div>

    <!-- CONTROLS -->
    <div class="controls">

        <!-- EMPTY SHOOT BUTTON -->
        <button
            class="shoot-button"
            onclick="shoot()"
        ></button>

        <!-- BACK -->
        <a
            class="back-button"
            href="index.html"
        >
            BACK
        </a>

    </div>

    <script>

        const game = document.getElementById("game");
        const menu = document.getElementById("menu");
        const menuTitle = document.getElementById("menuTitle");
        const startButton = document.getElementById("startButton");

        let enemies = [];
        let bullets = [];

        let gameStarted = false;
        let enemySpawner = null;

        /* START GAME */
        function startGame() {

            clearGame();

            gameStarted = true;

            menu.classList.remove("game-over");

            menu.classList.add("hidden");

            enemySpawner = setInterval(() => {
                createEnemy();
            }, 1000);
        }

        /* CREATE GREEN BOX */
        function createEnemy() {

            if (!gameStarted) return;

            const enemy = document.createElement("div");

            enemy.classList.add("enemy");

            /* CENTER */
            const centerY =
                (game.clientHeight / 2) - 25;

            enemy.style.left =
                game.clientWidth + "px";

            enemy.style.top =
                centerY + "px";

            game.appendChild(enemy);

            enemies.push({
                element: enemy,
                x: game.clientWidth,
                y: centerY
            });
        }

        /* SHOOT */
        function shoot() {

            if (!gameStarted) return;

            const bullet = document.createElement("div");

            bullet.classList.add("bullet");

            const playerX = 100 + 60;

            bullet.style.left =
                playerX + "px";

            bullet.style.top =
                (game.clientHeight / 2 - 6) + "px";

            game.appendChild(bullet);

            bullets.push({
                element: bullet,
                x: playerX,
                y: game.clientHeight / 2 - 6
            });
        }

        /* GAME OVER */
        function gameOver() {

            gameStarted = false;

            clearInterval(enemySpawner);

            enemySpawner = null;

            /* REMOVE EVERYTHING */
            enemies.forEach(enemy => {
                enemy.element.remove();
            });

            bullets.forEach(bullet => {
                bullet.element.remove();
            });

            enemies = [];
            bullets = [];

            /* DARK MENU */
            menu.classList.remove("hidden");

            menu.classList.add("game-over");

            menuTitle.textContent = "GAME OVER";

            startButton.textContent = "RESTART";
        }

        /* CLEAR GAME */
        function clearGame() {

            enemies.forEach(enemy => {
                enemy.element.remove();
            });

            bullets.forEach(bullet => {
                bullet.element.remove();
            });

            enemies = [];
            bullets = [];
        }

        /* GAME LOOP */
        function gameLoop() {

            if (gameStarted) {

                /* MOVE GREEN BOXES */
                for (
                    let i = enemies.length - 1;
                    i >= 0;
                    i--
                ) {

                    const enemy = enemies[i];

                    enemy.x -= 4;

                    enemy.element.style.left =
                        enemy.x + "px";

                    /* PLAYER COLLISION */
                    const playerRect =
                        document
                            .getElementById("player")
                            .getBoundingClientRect();

                    const enemyRect =
                        enemy.element.getBoundingClientRect();

                    if (
                        playerRect.left < enemyRect.right &&
                        playerRect.right > enemyRect.left &&
                        playerRect.top < enemyRect.bottom &&
                        playerRect.bottom > enemyRect.top
                    ) {

                        gameOver();

                        break;
                    }

                    /* REMOVE AT LEFT */
                    if (enemy.x < -60) {

                        enemy.element.remove();

                        enemies.splice(i, 1);
                    }
                }

                /* MOVE BULLETS */
                for (
                    let i = bullets.length - 1;
                    i >= 0;
                    i--
                ) {

                    const bullet = bullets[i];

                    bullet.x += 8;

                    bullet.element.style.left =
                        bullet.x + "px";

                    /* REMOVE AT RIGHT */
                    if (bullet.x > game.clientWidth) {

                        bullet.element.remove();

                        bullets.splice(i, 1);
                    }
                }

                /* BULLET COLLISIONS */
                for (
                    let b = bullets.length - 1;
                    b >= 0;
                    b--
                ) {

                    let bulletDestroyed = false;

                    for (
                        let e = enemies.length - 1;
                        e >= 0;
                        e--
                    ) {

                        const bulletRect =
                            bullets[b].element
                                .getBoundingClientRect();

                        const enemyRect =
                            enemies[e].element
                                .getBoundingClientRect();

                        if (
                            bulletRect.left < enemyRect.right &&
                            bulletRect.right > enemyRect.left &&
                            bulletRect.top < enemyRect.bottom &&
                            bulletRect.bottom > enemyRect.top
                        ) {

                            enemies[e].element.remove();

                            bullets[b].element.remove();

                            enemies.splice(e, 1);

                            bullets.splice(b, 1);

                            bulletDestroyed = true;

                            break;
                        }
                    }

                    if (bulletDestroyed) {
                        continue;
                    }
                }
            }

            requestAnimationFrame(gameLoop);
        }

        /* START LOOP */
        gameLoop();

    </script>

</body>
</html>
