<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - SlimeManMillerVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 110%;
        }

        body {
            margin: 0;
            min-height: 110vh;
            background: #5f9f55;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .game {
            position: relative;
            width: 100vw;
            height: 85vh;
            background: #4f8748;
            overflow: hidden;
        }

        /* PLAYER */
        .player {
            position: absolute;
            left: 100px;
            top: 50%;
            width: 60px;
            height: 60px;
            background: #777d79;
            transform: translateY(-50%);
            transition: background 0.2s;
        }

        .player.high-streak {
            background: #b85f5f;
        }

        /* COOLEST COOKIE */
        .player.secret-code {
            background: red !important;
        }

        .player.secret-code::before,
        .player.secret-code::after {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            width: 70px;
            height: 8px;
            background: black;
            transform-origin: center;
        }

        .player.secret-code::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .player.secret-code::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        /* KIRBY COOKIE */
        .player.kirby-code {
            background: #54206f !important;
        }

        /* ENEMIES */
        .enemy {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #8fd18a;
            transform: translateY(-50%);
        }

        /* BULLETS */
        .bullet {
            position: absolute;
            width: 35px;
            height: 12px;
            background: #ffd900;
        }

        .bullet.high-streak {
            background: #8b1e1e;
        }

        /* KILLS */
        .kills {
            position: absolute;
            top: 20px;
            left: 25px;
            color: black;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
        }

        /* STREAK */
        .streak {
            position: absolute;
            top: 20px;
            right: 25px;
            color: black;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
        }

        .streak.high-streak {
            color: red;
        }

        /* CONTROLS */
        .controls {
            position: relative;
            width: 100%;
            height: 15vh;
            min-height: 120px;
            background: #286b32;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .control-button {
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 12px;
            background: #4f5a52;
            color: white;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
            user-select: none;

            transition:
                transform 0.1s,
                background 0.2s;
        }

        .control-button:hover {
            background: #5d6961;
        }

        .control-button:active {
            transform: scale(0.92);
        }

        .shoot-button {
            width: 220px;
            height: 80px;
            font-size: 50px;
            font-weight: bold;
        }

        /* CODE AREA */
        .code-area {
            position: fixed;
            right: 20px;
            bottom: 20px;

            display: flex;
            align-items: center;
            gap: 8px;

            z-index: 100;
        }

        .code-input {
            width: 190px;
            height: 60px;

            border: none;
            border-radius: 12px;

            background: #eeeeee;
            color: black;

            padding: 0 15px;

            font-size: 20px;
            font-weight: bold;

            outline: none;
        }

        .code-input::placeholder {
            color: #777;
        }

        .code-check {
            width: 60px;
            height: 60px;

            border: none;
            border-radius: 12px;

            background: #4f5a52;
            color: white;

            font-size: 30px;
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.1s,
                background 0.2s;
        }

        .code-check:hover {
            background: #5d6961;
        }

        .code-check:active {
            transform: scale(0.92);
        }

        /* MENU BUTTON */
        .menu-button {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            width: 150px;
            height: 55px;

            background: #4f5a52;
            color: white;

            border: none;
            border-radius: 12px;

            font-size: 24px;
            font-weight: bold;

            cursor: pointer;

            z-index: 15;
        }

        .menu-button:hover {
            background: #5d6961;
            transform: translateX(-50%) scale(1.05);
        }

        /* SKIN MENU */
        .skin-menu {
            position: absolute;
            inset: 0;

            background: rgba(20, 35, 20, 0.85);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            z-index: 40;
        }

        .skin-title {
            color: black;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .skins {
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .skin-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .skin-square {
            width: 90px;
            height: 90px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
        }

        /* BLUE 500 KILLS SKIN */
        .skin-blue {
            background: #00a8f3;
        }

        /* LOCKED SKINS */
        .skin-locked {
            background: #3d4140;
            cursor: not-allowed;
        }

        /* RED X */
        .skin-locked::before,
        .skin-locked::after {
            content: "";
            position: absolute;

            left: 50%;
            top: 50%;

            width: 75px;
            height: 8px;

            background: red;
        }

        .skin-locked::before {
            transform: translate(-50%, -50%) rotate(45deg);
        }

        .skin-locked::after {
            transform: translate(-50%, -50%) rotate(-45deg);
        }

        .skin-label {
            color: black;
            font-size: 18px;
            font-weight: bold;
        }

        .skin-back {
            margin-top: 35px;

            width: 180px;
            height: 65px;

            background: #4f5a52;
            color: white;

            border: none;
            border-radius: 12px;

            font-size: 24px;
            font-weight: bold;

            cursor: pointer;
        }

        .skin-back:hover {
            background: #5d6961;
        }

        .hidden {
            display: none !important;
        }

        /* BOTTOM */
        .bottom {
            width: 100%;
            height: 15vh;
            min-height: 120px;
            background: #286b32;
            position: relative;
        }

        /* BACK */
        .back-button {
            position: absolute;
            left: 10px;
            bottom: 10px;

            width: 150px;
            height: 60px;

            background: #4f5a52;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;

            cursor: pointer;

            transition:
                transform 0.2s,
                background 0.2s;

            z-index: 30;
        }

        .back-button:hover {
            transform: scale(1.05);
            background: #5d6961;
        }

        /* START MENU */
        .menu {
            position: absolute;
            inset: 0;

            background: rgba(20, 35, 20, 0.55);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            z-index: 20;
        }

        .game-over {
            background: rgba(10, 15, 10, 0.78);
        }

        .menu-title {
            color: black;
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .start-button {
            width: 280px;
            height: 120px;

            background: #4f5a52;
            border: none;
            border-radius: 15px;

            color: white;
            font-size: 32px;
            font-weight: bold;

            cursor: pointer;
        }

        .start-button:hover {
            background: #5d6961;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="game" id="game">

        <div class="kills" id="kills">
            KILLS: 0
        </div>

        <div class="streak" id="streak">
            STREAK: 0
        </div>

        <!-- ONLY APPEARS AT 500+ KILLS -->
        <button
            class="menu-button hidden"
            id="menuButton"
            onclick="openSkinMenu()"
        >
            MENU
        </button>

        <div class="player" id="player"></div>

        <!-- START / GAME OVER -->
        <div class="menu" id="menu">

            <div class="menu-title" id="menuTitle">
                GAME
            </div>

            <button
                class="start-button"
                id="startButton"
                onclick="startGame()"
            >
                START
            </button>

        </div>

        <!-- SKIN MENU -->
        <div
            class="skin-menu hidden"
            id="skinMenu"
        >

            <div class="skin-title">
                MENU
            </div>

            <div class="skins">

                <!-- BLUE -->
                <div class="skin-option">

                    <button
                        class="skin-square skin-blue"
                        onclick="selectBlueSkin()"
                    ></button>

                    <div class="skin-label">
                        500 KILLS
                    </div>

                </div>

                <!-- LOCKED 2 -->
                <div class="skin-option">
                    <button
                        class="skin-square skin-locked"
                        disabled
                    ></button>
                </div>

                <!-- LOCKED 3 -->
                <div class="skin-option">
                    <button
                        class="skin-square skin-locked"
                        disabled
                    ></button>
                </div>

                <!-- LOCKED 4 -->
                <div class="skin-option">
                    <button
                        class="skin-square skin-locked"
                        disabled
                    ></button>
                </div>

                <!-- LOCKED 5 -->
                <div class="skin-option">
                    <button
                        class="skin-square skin-locked"
                        disabled
                    ></button>
                </div>

                <!-- LOCKED 6 -->
                <div class="skin-option">
                    <button
                        class="skin-square skin-locked"
                        disabled
                    ></button>
                </div>

            </div>

            <button
                class="skin-back"
                onclick="closeSkinMenu()"
            >
                BACK
            </button>

        </div>

    </div>


    <!-- CONTROLS -->
    <div class="controls">

        <button
            class="control-button"
            onclick="movePlayer(1)"
        >
            ↓
        </button>

        <button
            class="control-button shoot-button"
            onclick="shoot()"
        >
            -
        </button>

        <button
            class="control-button"
            onclick="movePlayer(-1)"
        >
            ↑
        </button>

    </div>


    <!-- CODE -->
    <div class="code-area">

        <input
            class="code-input"
            id="codeInput"
            type="text"
            placeholder="CODE"
            autocomplete="off"
        >

        <button
            class="code-check"
            id="codeCheck"
        >
            ✓
        </button>

    </div>


    <div class="bottom">

        <a
            class="back-button"
            href="index.html"
        >
            BACK
        </a>

    </div>


    <script>

        const game =
            document.getElementById("game");

        const menu =
            document.getElementById("menu");

        const menuTitle =
            document.getElementById("menuTitle");

        const startButton =
            document.getElementById("startButton");

        const killsText =
            document.getElementById("kills");

        const streakText =
            document.getElementById("streak");

        const player =
            document.getElementById("player");

        const menuButton =
            document.getElementById("menuButton");

        const skinMenu =
            document.getElementById("skinMenu");

        const codeInput =
            document.getElementById("codeInput");

        const codeCheck =
            document.getElementById("codeCheck");


        let enemies = [];
        let bullets = [];

        let gameStarted = false;
        let enemySpawner = null;

        let blueSkin = false;


        /* PLAYER LANES */

        const lanes = [
            10,
            18,
            26,
            34,
            42,
            50,
            58,
            66,
            74,
            82,
            90
        ];

        let playerLane = 5;


        /* PERMANENT KILLS */

        let kills = Number(
            localStorage.getItem(
                "slimeManMillerKills"
            ) || 0
        );


        /* CURRENT STREAK */

        let streak = 0;


        killsText.textContent =
            "KILLS: " + kills;

        streakText.textContent =
            "STREAK: " + streak;


        /* MENU ONLY AFTER 500 KILLS */

        function updateMenuButton() {

            if (kills >= 500) {

                menuButton.classList.remove(
                    "hidden"
                );

            } else {

                menuButton.classList.add(
                    "hidden"
                );
            }
        }


        updateMenuButton();


        /* UPDATE PLAYER */

        function updatePlayer() {

            playerLane =
                Math.max(
                    0,
                    Math.min(
                        lanes.length - 1,
                        playerLane
                    )
                );

            player.style.top =
                lanes[playerLane] + "%";
        }


        /* MOVE PLAYER */

        function movePlayer(direction) {

            if (!gameStarted) return;

            playerLane += direction;

            playerLane =
                Math.max(
                    0,
                    Math.min(
                        lanes.length - 1,
                        playerLane
                    )
                );

            updatePlayer();
        }


        /* ADD KILL */

        function addKill() {

            kills++;

            killsText.textContent =
                "KILLS: " + kills;

            localStorage.setItem(
                "slimeManMillerKills",
                kills
            );

            updateMenuButton();


            streak++;

            streakText.textContent =
                "STREAK: " + streak;


            if (streak >= 25) {

                streakText.classList.add(
                    "high-streak"
                );

                if (
                    !player.classList.contains(
                        "secret-code"
                    ) &&
                    !player.classList.contains(
                        "kirby-code"
                    ) &&
                    !blueSkin
                ) {

                    player.classList.add(
                        "high-streak"
                    );
                }
            }
        }


        /* RESET STREAK */

        function resetStreak() {

            streak = 0;

            streakText.textContent =
                "STREAK: 0";

            streakText.classList.remove(
                "high-streak"
            );

            if (
                !player.classList.contains(
                    "secret-code"
                ) &&
                !player.classList.contains(
                    "kirby-code"
                ) &&
                !blueSkin
            ) {

                player.classList.remove(
                    "high-streak"
                );
            }
        }


        /* START GAME */

        function startGame() {

            clearGame();

            resetStreak();

            gameStarted = true;

            playerLane = 5;

            updatePlayer();

            menu.classList.remove(
                "game-over"
            );

            menu.classList.add(
                "hidden"
            );

            skinMenu.classList.add(
                "hidden"
            );

            enemySpawner =
                setInterval(
                    createEnemy,
                    1000
                );
        }


        /* OPEN MENU */

        function openSkinMenu() {

            if (kills < 500) return;

            gameStarted = false;

            clearInterval(
                enemySpawner
            );

            enemySpawner = null;

            clearGame();

            resetStreak();

            skinMenu.classList.remove(
                "hidden"
            );
        }


        /* CLOSE MENU */

        function closeSkinMenu() {

            skinMenu.classList.add(
                "hidden"
            );

            menu.classList.remove(
                "hidden"
            );

            menuTitle.textContent =
                "GAME";

            startButton.textContent =
                "START";
        }


        /* BLUE SKIN */

        function selectBlueSkin() {

            if (kills < 500) return;

            blueSkin = true;

            player.classList.remove(
                "secret-code"
            );

            player.classList.remove(
                "kirby-code"
            );

            player.classList.remove(
                "high-streak"
            );

            player.style.background =
                "#00a8f3";

            skinMenu.classList.add(
                "hidden"
            );

            menu.classList.remove(
                "hidden"
            );

            menuTitle.textContent =
                "GAME";

            startButton.textContent =
                "START";
        }


        /* CREATE ENEMY */

        function createEnemy() {

            if (!gameStarted) return;

            const enemy =
                document.createElement("div");

            enemy.classList.add(
                "enemy"
            );

            const randomIndex =
                Math.floor(
                    Math.random() *
                    lanes.length
                );

            const randomLane =
                lanes[randomIndex];

            enemy.style.left =
                game.clientWidth + "px";

            enemy.style.top =
                randomLane + "%";

            game.appendChild(enemy);

            enemies.push({

                element: enemy,

                x: game.clientWidth,

                lane: randomIndex

            });
        }


        /* SHOOT */

        function shoot() {

            if (!gameStarted) return;

            const bullet =
                document.createElement("div");

            bullet.classList.add(
                "bullet"
            );

            if (streak >= 25) {

                bullet.classList.add(
                    "high-streak"
                );
            }

            const playerX =
                100 + 60;

            bullet.style.left =
                playerX + "px";

            bullet.style.top =
                "calc(" +
                lanes[playerLane] +
                "% - 6px)";

            game.appendChild(bullet);

            bullets.push({

                element: bullet,

                x: playerX,

                lane: playerLane

            });
        }


        /* GAME OVER */

        function gameOver() {

            gameStarted = false;

            clearInterval(
                enemySpawner
            );

            enemySpawner = null;

            enemies.forEach(enemy => {
                enemy.element.remove();
            });

            bullets.forEach(bullet => {
                bullet.element.remove();
            });

            enemies = [];
            bullets = [];

            resetStreak();

            menu.classList.remove(
                "hidden"
            );

            menu.classList.add(
                "game-over"
            );

            menuTitle.textContent =
                "GAME OVER";

            startButton.textContent =
                "RESTART";
        }


        /* CLEAR GAME */

        function clearGame() {

            enemies.forEach(enemy => {
                enemy.element.remove();
            });

            bullets.forEach(bullet => {
                bullet.element.remove();
            });

            enemies = [];
            bullets = [];
        }


        /* CODE SYSTEM */

        codeCheck.addEventListener(
            "click",
            function() {

                const enteredCode =
                    codeInput.value.trim();


                /* COOLEST COOKIE */

                if (
                    enteredCode ===
                    "COOLEST.COOKIE.HTJYXX"
                ) {

                    player.classList.remove(
                        "kirby-code"
                    );

                    player.classList.remove(
                        "high-streak"
                    );

                    blueSkin = false;

                    player.style.background =
                        "red";

                    player.classList.add(
                        "secret-code"
                    );

                    codeInput.value = "";

                    return;
                }


                /* KIRBY COOKIE */

                if (
                    enteredCode ===
                    "KIRBY.COOKIE.HTJXX"
                ) {

                    player.classList.remove(
                        "secret-code"
                    );

                    player.classList.remove(
                        "high-streak"
                    );

                    blueSkin = false;

                    player.style.background =
                        "#54206f";

                    player.classList.add(
                        "kirby-code"
                    );

                    codeInput.value = "";

                    return;
                }


                /* STREAK CODE */

                if (
                    enteredCode ===
                    "STREAK.CODE"
                ) {

                    streak = 25;

                    streakText.textContent =
                        "STREAK: " + streak;

                    streakText.classList.add(
                        "high-streak"
                    );

                    if (
                        !player.classList.contains(
                            "secret-code"
                        ) &&
                        !player.classList.contains(
                            "kirby-code"
                        ) &&
                        !blueSkin
                    ) {

                        player.classList.add(
                            "high-streak"
                        );
                    }

                    codeInput.value = "";

                    return;
                }


                /* 500 KILL CODE
                   +500, NOT SET TO 500
                   ONE USE ONLY */

                if (
                    enteredCode ===
                    "500KILL.CODE"
                ) {

                    const codeUsed =
                        localStorage.getItem(
                            "500KillCodeUsed"
                        ) === "true";


                    if (codeUsed) {

                        codeInput.value =
                            "CODE USED";

                        setTimeout(
                            function() {
                                codeInput.value = "";
                            },
                            1500
                        );

                        return;
                    }


                    /* ADD 500 TO CURRENT KILLS */

                    kills += 500;


                    killsText.textContent =
                        "KILLS: " + kills;


                    localStorage.setItem(
                        "slimeManMillerKills",
                        kills
                    );


                    /* MARK CODE AS USED */

                    localStorage.setItem(
                        "500KillCodeUsed",
                        "true"
                    );


                    /* UPDATE 500+ MENU */

                    updateMenuButton();


                    codeInput.value = "";

                    return;
                }


                /* UNKNOWN CODE */

                codeInput.value = "";
            }
        );


        /* ENTER TO SUBMIT */

        codeInput.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    codeCheck.click();

                }

            }
        );


        /* GAME LOOP */

        function gameLoop() {

            if (gameStarted) {

                /* MOVE ENEMIES */

                for (
                    let i =
                        enemies.length - 1;

                    i >= 0;

                    i--
                ) {

                    const enemy =
                        enemies[i];

                    enemy.x -= 4;

                    enemy.element.style.left =
                        enemy.x + "px";


                    const playerRect =
                        player.getBoundingClientRect();

                    const enemyRect =
                        enemy.element
                            .getBoundingClientRect();


                    if (
                        playerRect.left <
                            enemyRect.right &&

                        playerRect.right >
                            enemyRect.left &&

                        playerRect.top <
                            enemyRect.bottom &&

                        playerRect.bottom >
                            enemyRect.top
                    ) {

                        gameOver();

                        break;
                    }


                    if (
                        enemy.x < -60
                    ) {

                        enemy.element.remove();

                        enemies.splice(
                            i,
                            1
                        );
                    }
                }


                /* MOVE BULLETS */

                for (
                    let i =
                        bullets.length - 1;

                    i >= 0;

                    i--
                ) {

                    const bullet =
                        bullets[i];

                    bullet.x += 8;

                    bullet.element.style.left =
                        bullet.x + "px";


                    if (
                        bullet.x >
                        game.clientWidth
                    ) {

                        bullet.element.remove();

                        bullets.splice(
                            i,
                            1
                        );
                    }
                }


                /* BULLET COLLISIONS */

                for (
                    let b =
                        bullets.length - 1;

                    b >= 0;

                    b--
                ) {

                    for (
                        let e =
                            enemies.length - 1;

                        e >= 0;

                        e--
                    ) {

                        const bulletRect =
                            bullets[b]
                                .element
                                .getBoundingClientRect();

                        const enemyRect =
                            enemies[e]
                                .element
                                .getBoundingClientRect();


                        if (
                            bulletRect.left <
                                enemyRect.right &&

                            bulletRect.right >
                                enemyRect.left &&

                            bulletRect.top <
                                enemyRect.bottom &&

                            bulletRect.bottom >
                                enemyRect.top
                        ) {

                            enemies[e]
                                .element
                                .remove();

                            bullets[b]
                                .element
                                .remove();

                            enemies.splice(
                                e,
                                1
                            );

                            bullets.splice(
                                b,
                                1
                            );

                            addKill();

                            break;
                        }
                    }
                }
            }

            requestAnimationFrame(
                gameLoop
            );
        }


        /* START */

        updatePlayer();

        gameLoop();

    </script>
