<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - SlimeManMillerVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 110%;
        }

        body {
            margin: 0;
            min-height: 110vh;
            background: #5f9f55;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* GAME AREA */
        .game {
            position: relative;
            width: 100vw;
            height: 85vh;
            background: #4f8748;
            overflow: hidden;
        }

        /* PLAYER */
        .player {
            position: absolute;
            left: 100px;
            top: 50%;
            width: 60px;
            height: 60px;
            background: #777d79;
            transform: translateY(-50%);
            transition: background 0.2s;
        }

        /* PLAYER AT 25+ STREAK */
        .player.high-streak {
            background: #b85f5f;
        }

        /* GREEN BOXES */
        .enemy {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #8fd18a;
        }

        /* NORMAL BULLET */
        .bullet {
            position: absolute;
            width: 35px;
            height: 12px;
            background: #ffd900;
        }

        /* RED BULLET AT 25+ STREAK */
        .bullet.high-streak {
            background: #8b1e1e;
        }

        /* KILLS */
        .kills {
            position: absolute;
            top: 20px;
            left: 25px;
            color: black;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
        }

        /* STREAK */
        .streak {
            position: absolute;
            top: 20px;
            right: 25px;
            color: black;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
        }

        /* RED STREAK AT 25+ */
        .streak.high-streak {
            color: red;
        }

        /* CONTROLS */
        .controls {
            position: relative;
            width: 100%;
            height: 15vh;
            min-height: 120px;
            background: #286b32;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        /* UP / DOWN BUTTONS */
        .control-button {
            width: 80px;
            height: 80px;

            border: none;
            border-radius: 12px;

            background: #4f5a52;

            color: white;
            font-size: 35px;
            font-weight: bold;

            cursor: pointer;
            user-select: none;

            transition:
                transform 0.1s,
                background 0.2s;
        }

        .control-button:hover {
            background: #5d6961;
        }

        .control-button:active {
            transform: scale(0.92);
        }

        /* SHOOT BUTTON */
        .shoot-button {
            width: 220px;
            height: 80px;
            font-size: 50px;
            font-weight: bold;
        }

        /* BOTTOM */
        .bottom {
            width: 100%;
            height: 15vh;
            min-height: 120px;
            background: #286b32;
            position: relative;
        }

        /* BACK BUTTON */
        .back-button {
            position: absolute;
            left: 10px;
            bottom: 10px;

            width: 150px;
            height: 60px;

            background: #4f5a52;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;

            cursor: pointer;

            transition:
                transform 0.2s,
                background 0.2s;

            z-index: 30;
        }

        .back-button:hover {
            transform: scale(1.05);
            background: #5d6961;
        }

        /* MENU */
        .menu {
            position: absolute;
            inset: 0;

            background: rgba(20, 35, 20, 0.55);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            z-index: 20;
        }

        /* GAME OVER MENU */
        .game-over {
            background: rgba(10, 15, 10, 0.78);
        }

        .menu-title {
            color: black;
            font-size: 50px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .game-over .menu-title {
            color: black;
        }

        /* START / RESTART */
        .start-button {
            width: 280px;
            height: 120px;

            background: #4f5a52;
            border: none;
            border-radius: 15px;

            color: white;
            font-size: 32px;
            font-weight: bold;

            cursor: pointer;
        }

        .start-button:hover {
            background: #5d6961;
            transform: scale(1.05);
        }

        /* HIDDEN */
        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <!-- GAME -->
    <div class="game" id="game">

        <!-- KILLS -->
        <div class="kills" id="kills">
            KILLS: 0
        </div>

        <!-- STREAK -->
        <div class="streak" id="streak">
            STREAK: 0
        </div>

        <!-- PLAYER -->
        <div class="player" id="player"></div>

        <!-- START / GAME OVER MENU -->
        <div class="menu" id="menu">

            <div class="menu-title" id="menuTitle">
                GAME
            </div>

            <button
                class="start-button"
                id="startButton"
                onclick="startGame()"
            >
                START
            </button>

        </div>

    </div>


    <!-- CONTROLS -->
    <div class="controls">

        <!-- DOWN -->
        <button
            class="control-button"
            onclick="movePlayer(1)"
        >
            ↓
        </button>

        <!-- SHOOT -->
        <button
            class="control-button shoot-button"
            onclick="shoot()"
        >
            -
        </button>

        <!-- UP -->
        <button
            class="control-button"
            onclick="movePlayer(-1)"
        >
            ↑
        </button>

    </div>


    <!-- BOTTOM -->
    <div class="bottom">

        <!-- BACK -->
        <a
            class="back-button"
            href="index.html"
        >
            BACK
        </a>

    </div>


    <script>

        const game =
            document.getElementById("game");

        const menu =
            document.getElementById("menu");

        const menuTitle =
            document.getElementById("menuTitle");

        const startButton =
            document.getElementById("startButton");

        const killsText =
            document.getElementById("kills");

        const streakText =
            document.getElementById("streak");

        const player =
            document.getElementById("player");


        let enemies = [];
        let bullets = [];

        let gameStarted = false;
        let enemySpawner = null;

        /* PLAYER POSITION */
        let playerY = 50;


        /* PLAYER / ENEMY SIZES */
        const PLAYER_SIZE = 60;
        const ENEMY_SIZE = 50;


        /* LOAD PERMANENT KILLS */
        let kills = Number(
            localStorage.getItem(
                "slimeManMillerKills"
            ) || 0
        );


        /* CURRENT STREAK */
        let streak = 0;


        killsText.textContent =
            "KILLS: " + kills;

        streakText.textContent =
            "STREAK: " + streak;


        /* UPDATE PLAYER */
        function updatePlayer() {

            /*
                The player itself can move
                between 10% and 90%.
            */

            playerY =
                Math.max(
                    10,
                    Math.min(
                        90,
                        playerY
                    )
                );

            player.style.top =
                playerY + "%";
        }


        /* MOVE PLAYER */
        function movePlayer(direction) {

            if (!gameStarted) return;

            /*
                -1 = UP
                 1 = DOWN
            */

            playerY +=
                direction * 8;

            updatePlayer();
        }


        /* ADD KILL */
        function addKill() {

            /* PERMANENT KILLS */
            kills++;

            killsText.textContent =
                "KILLS: " + kills;

            localStorage.setItem(
                "slimeManMillerKills",
                kills
            );


            /* STREAK */
            streak++;

            streakText.textContent =
                "STREAK: " + streak;


            /* 25+ STREAK */
            if (streak >= 25) {

                streakText.classList.add(
                    "high-streak"
                );

                player.classList.add(
                    "high-streak"
                );
            }
        }


        /* RESET STREAK */
        function resetStreak() {

            streak = 0;

            streakText.textContent =
                "STREAK: 0";

            streakText.classList.remove(
                "high-streak"
            );

            player.classList.remove(
                "high-streak"
            );
        }


        /* START GAME */
        function startGame() {

            clearGame();

            resetStreak();

            gameStarted = true;

            /* PLAYER STARTS IN MIDDLE */
            playerY = 50;

            updatePlayer();


            menu.classList.remove(
                "game-over"
            );

            menu.classList.add(
                "hidden"
            );


            enemySpawner =
                setInterval(() => {

                    createEnemy();

                }, 1000);
        }


        /* CREATE GREEN BOX */
        function createEnemy() {

            if (!gameStarted) return;


            const enemy =
                document.createElement("div");

            enemy.classList.add(
                "enemy"
            );


            /*
                IMPORTANT:

                The player moves from 10% to 90%.
                But the player is 60px tall.

                The enemy is 50px tall.

                So we calculate the positions
                using the actual pixel sizes.

                This prevents enemies from
                appearing in unreachable areas.
            */

            const gameHeight =
                game.clientHeight;


            const playerHalf =
                PLAYER_SIZE / 2;

            const enemyHalf =
                ENEMY_SIZE / 2;


            /*
                Player center can move between:
                10% and 90%.

                Enemy center must stay within
                the same reachable area.
            */

            const minCenter =
                (gameHeight * 0.10)
                + playerHalf;

            const maxCenter =
                (gameHeight * 0.90)
                - playerHalf;


            /*
                Convert the allowed center
                position into a percentage.
            */

            const minY =
                (
                    minCenter /
                    gameHeight
                ) * 100;

            const maxY =
                (
                    maxCenter /
                    gameHeight
                ) * 100;


            const randomY =
                Math.random() *
                (maxY - minY)
                + minY;


            enemy.style.left =
                game.clientWidth + "px";


            enemy.style.top =
                randomY + "%";


            game.appendChild(enemy);


            enemies.push({

                element: enemy,

                x: game.clientWidth,

                y: randomY

            });
        }


        /* SHOOT */
        function shoot() {

            if (!gameStarted) return;


            const bullet =
                document.createElement("div");

            bullet.classList.add(
                "bullet"
            );


            /*
                25+ STREAK
                = DARK RED BULLET
            */

            if (streak >= 25) {

                bullet.classList.add(
                    "high-streak"
                );
            }


            const playerX =
                100 + 60;


            bullet.style.left =
                playerX + "px";


            bullet.style.top =
                "calc(" +
                playerY +
                "% - 6px)";


            game.appendChild(bullet);


            bullets.push({

                element: bullet,

                x: playerX,

                y: playerY

            });
        }


        /* GAME OVER */
        function gameOver() {

            gameStarted = false;


            clearInterval(
                enemySpawner
            );

            enemySpawner = null;


            enemies.forEach(enemy => {

                enemy.element.remove();

            });


            bullets.forEach(bullet => {

                bullet.element.remove();

            });


            enemies = [];
            bullets = [];


            /* RESET STREAK */
            resetStreak();


            /* SHOW GAME OVER */
            menu.classList.remove(
                "hidden"
            );

            menu.classList.add(
                "game-over"
            );


            menuTitle.textContent =
                "GAME OVER";


            startButton.textContent =
                "RESTART";
        }


        /* CLEAR GAME */
        function clearGame() {

            enemies.forEach(enemy => {

                enemy.element.remove();

            });


            bullets.forEach(bullet => {

                bullet.element.remove();

            });


            enemies = [];
            bullets = [];
        }


        /* GAME LOOP */
        function gameLoop() {

            if (gameStarted) {


                /* MOVE ENEMIES */

                for (
                    let i =
                        enemies.length - 1;

                    i >= 0;

                    i--
                ) {

                    const enemy =
                        enemies[i];


                    enemy.x -= 4;


                    enemy.element.style.left =
                        enemy.x + "px";


                    /* PLAYER COLLISION */

                    const playerRect =
                        player.getBoundingClientRect();

                    const enemyRect =
                        enemy.element
                            .getBoundingClientRect();


                    if (
                        playerRect.left <
                            enemyRect.right &&

                        playerRect.right >
                            enemyRect.left &&

                        playerRect.top <
                            enemyRect.bottom &&

                        playerRect.bottom >
                            enemyRect.top
                    ) {

                        gameOver();

                        break;
                    }


                    /* REMOVE LEFT */

                    if (enemy.x < -60) {

                        enemy.element.remove();

                        enemies.splice(i, 1);
                    }
                }


                /* MOVE BULLETS */

                for (
                    let i =
                        bullets.length - 1;

                    i >= 0;

                    i--
                ) {

                    const bullet =
                        bullets[i];


                    bullet.x += 8;


                    bullet.element.style.left =
                        bullet.x + "px";


                    if (
                        bullet.x >
                        game.clientWidth
                    ) {

                        bullet.element.remove();

                        bullets.splice(i, 1);
                    }
                }


                /* BULLET COLLISIONS */

                for (
                    let b =
                        bullets.length - 1;

                    b >= 0;

                    b--
                ) {

                    for (
                        let e =
                            enemies.length - 1;

                        e >= 0;

                        e--
                    ) {

                        const bulletRect =
                            bullets[b]
                                .element
                                .getBoundingClientRect();


                        const enemyRect =
                            enemies[e]
                                .element
                                .getBoundingClientRect();


                        if (
                            bulletRect.left <
                                enemyRect.right &&

                            bulletRect.right >
                                enemyRect.left &&

                            bulletRect.top <
                                enemyRect.bottom &&

                            bulletRect.bottom >
                                enemyRect.top
                        ) {


                            /* REMOVE ENEMY */

                            enemies[e]
                                .element
                                .remove();


                            /* REMOVE BULLET */

                            bullets[b]
                                .element
                                .remove();


                            enemies.splice(
                                e,
                                1
                            );

                            bullets.splice(
                                b,
                                1
                            );


                            /* KILL +1 */
                            addKill();


                            break;
                        }
                    }
                }
            }


            requestAnimationFrame(
                gameLoop
            );
        }


        /* START LOOP */
        gameLoop();

    </script>

</body>
</html>
