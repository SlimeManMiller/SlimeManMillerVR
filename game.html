<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - SlimeManMillerVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 180vh;
            font-family: Arial, sans-serif;
            background: #5f9f55;
            overflow-x: hidden;
        }

        /* GAME AREA */
        .game-page {
            position: relative;
            min-height: 180vh;
        }

        .game-area {
            position: relative;
            height: 120vh;
            min-height: 700px;
            overflow: hidden;

            background: linear-gradient(
                to bottom,
                #205f2c 0%,
                #286b32 25%,
                #3f833f 55%,
                #5f9f55 100%
            );
        }

        /* DARK OVERLAY */
        .dark-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            pointer-events: none;
            z-index: 10;
            display: none;
        }

        /* PLAYER */
        .player {
            position: absolute;

            width: 55px;
            height: 55px;

            background: #b8b8b8;
            border-radius: 4px;

            left: 15%;
            top: 50%;

            transform: translateY(-50%);

            z-index: 5;
        }

        /* ENEMIES */
        .enemy {
            position: absolute;

            width: 45px;
            height: 45px;

            background: #7ed957;
            border-radius: 3px;

            z-index: 4;
        }

        /* BULLETS */
        .bullet {
            position: absolute;

            width: 35px;
            height: 12px;

            background: #7a1515;
            border-radius: 3px;

            z-index: 3;
        }

        /* HUD */
        .kills {
            position: fixed;
            top: 20px;
            left: 20px;

            color: black;
            font-size: 26px;
            font-weight: bold;

            z-index: 100;
        }

        .streak {
            position: fixed;
            top: 20px;
            right: 20px;

            color: black;
            font-size: 26px;
            font-weight: bold;

            z-index: 100;
        }

        .streak.hot {
            color: red;
        }

        /* START / GAME OVER */
        .menu {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            z-index: 50;
        }

        .menu-title {
            color: black;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .start-button,
        .restart-button {
            width: 230px;
            height: 90px;

            border: none;
            border-radius: 15px;

            background: #4f5a52;
            color: white;

            font-size: 30px;
            font-weight: bold;

            cursor: pointer;
        }

        .start-button:hover,
        .restart-button:hover {
            background: #5d6961;
        }

        /* GAME OVER */
        .game-over {
            color: black;
        }

        /* CONTROLS */
        .controls {
            position: fixed;

            left: 50%;
            bottom: 30px;

            transform: translateX(-50%);

            display: flex;
            align-items: center;
            gap: 12px;

            z-index: 100;
        }

        .control-button {
            width: 65px;
            height: 65px;

            border: none;
            border-radius: 8px;

            background: #4f5a52;
            color: white;

            font-size: 30px;
            font-weight: bold;

            cursor: pointer;
        }

        .control-button:hover {
            background: #5d6961;
        }

        .shoot-button {
            width: 150px;
            height: 65px;
        }

        .shoot-line {
            display: block;
            font-size: 30px;
            line-height: 20px;
        }

        /* CODE BOX */
        .code-area {
            position: fixed;

            right: 25px;
            bottom: 30px;

            display: flex;
            align-items: center;
            gap: 8px;

            z-index: 101;
        }

        .code-input {
            width: 180px;
            height: 55px;

            border: none;
            outline: none;

            border-radius: 8px;

            padding: 0 15px;

            background: #eeeeee;
            color: black;

            font-size: 18px;
        }

        .code-check {
            width: 55px;
            height: 55px;

            border: none;
            border-radius: 8px;

            background: #4f5a52;
            color: white;

            font-size: 28px;
            font-weight: bold;

            cursor: pointer;
        }

        .code-check:hover {
            background: #5d6961;
        }

        /* BACK */
        .back-container {
            position: relative;

            height: 60vh;

            display: flex;
            align-items: flex-end;
            justify-content: flex-start;

            padding: 35px;
        }

        .back-button {
            width: 180px;
            height: 80px;

            background: #718b78;
            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 26px;
            font-weight: bold;
            text-decoration: none;

            transition: transform 0.2s, background 0.2s;
        }

        .back-button:hover {
            transform: scale(1.05);
            background: #809b87;
        }
    </style>
</head>

<body>

<div class="game-page">

    <div class="game-area" id="gameArea">

        <!-- HUD -->
        <div class="kills" id="kills">
            KILLS: 0
        </div>

        <div class="streak" id="streak">
            STREAK: 0
        </div>


        <!-- PLAYER -->
        <div class="player" id="player"></div>


        <!-- START MENU -->
        <div class="menu" id="startMenu">

            <div class="menu-title">
                GAME
            </div>

            <button
                class="start-button"
                id="startButton"
            >
                START
            </button>

        </div>


        <!-- GAME OVER -->
        <div
            class="menu"
            id="gameOverMenu"
            style="display: none;"
        >

            <div class="menu-title game-over">
                GAME OVER
            </div>

            <button
                class="restart-button"
                id="restartButton"
            >
                RESTART
            </button>

        </div>


        <!-- CONTROLS -->
        <div class="controls">

            <button
                class="control-button"
                id="downButton"
            >
                ↓
            </button>

            <button
                class="control-button shoot-button"
                id="shootButton"
            >
                <span class="shoot-line">−</span>
            </button>

            <button
                class="control-button"
                id="upButton"
            >
                ↑
            </button>

        </div>


        <!-- CODE -->
        <div class="code-area">

            <input
                class="code-input"
                id="codeInput"
                type="text"
                placeholder="CODE"
                autocomplete="off"
            >

            <button
                class="code-check"
                id="codeCheck"
            >
                ✓
            </button>

        </div>

        <div class="dark-overlay" id="darkOverlay"></div>

    </div>


    <!-- BACK -->
    <div class="back-container">

        <a
            class="back-button"
            href="index.html"
        >
            BACK
        </a>

    </div>

</div>


<script>

    const gameArea = document.getElementById("gameArea");
    const player = document.getElementById("player");

    const startMenu = document.getElementById("startMenu");
    const gameOverMenu = document.getElementById("gameOverMenu");
    const darkOverlay = document.getElementById("darkOverlay");

    const killsText = document.getElementById("kills");
    const streakText = document.getElementById("streak");

    const startButton = document.getElementById("startButton");
    const restartButton = document.getElementById("restartButton");

    const upButton = document.getElementById("upButton");
    const downButton = document.getElementById("downButton");
    const shootButton = document.getElementById("shootButton");

    const codeInput = document.getElementById("codeInput");
    const codeCheck = document.getElementById("codeCheck");


    let gameRunning = false;

    let kills = 0;
    let streak = 0;

    let playerY = 50;

    let enemies = [];
    let bullets = [];

    let enemyTimer = null;
    let gameLoop = null;


    /* PLAYER MOVEMENT */

    function movePlayer(amount) {

        if (!gameRunning) return;

        playerY += amount;

        /* Keep player away from the very top and bottom */
        if (playerY < 8) {
            playerY = 8;
        }

        if (playerY > 92) {
            playerY = 92;
        }

        player.style.top = playerY + "%";
    }


    upButton.addEventListener("click", function () {
        movePlayer(-7);
    });

    downButton.addEventListener("click", function () {
        movePlayer(7);
    });


    /* SHOOT */

    shootButton.addEventListener("click", function () {

        if (!gameRunning) return;

        const bullet = document.createElement("div");

        bullet.className = "bullet";

        const playerRect = player.getBoundingClientRect();
        const areaRect = gameArea.getBoundingClientRect();

        bullet.style.left =
            (playerRect.right - areaRect.left) + "px";

        bullet.style.top =
            (playerRect.top - areaRect.top + playerRect.height / 2 - 6) + "px";

        gameArea.appendChild(bullet);

        bullets.push({
            element: bullet,
            x: playerRect.right - areaRect.left,
            y: playerRect.top - areaRect.top + playerRect.height / 2
        });

    });


    /* ENEMIES */

    function createEnemy() {

        if (!gameRunning) return;

        const enemy = document.createElement("div");

        enemy.className = "enemy";

        const areaHeight = gameArea.clientHeight;

        /*
            Enemies can spawn throughout the player's
            reachable area, but not directly at the edges.
        */
        const minY = areaHeight * 0.08;
        const maxY = areaHeight * 0.92;

        const y =
            minY +
            Math.random() * (maxY - minY);

        enemy.style.left = gameArea.clientWidth + "px";
        enemy.style.top = y + "px";

        gameArea.appendChild(enemy);

        enemies.push({
            element: enemy,
            x: gameArea.clientWidth,
            y: y,
            speed: 2 + Math.random() * 1.5
        });
    }


    /* COLLISION */

    function isColliding(a, b) {

        const ar = a.getBoundingClientRect();
        const br = b.getBoundingClientRect();

        return !(
            ar.right < br.left ||
            ar.left > br.right ||
            ar.bottom < br.top ||
            ar.top > br.bottom
        );
    }


    /* GAME OVER */

    function gameOver() {

        gameRunning = false;

        clearInterval(enemyTimer);
        cancelAnimationFrame(gameLoop);

        streak = 0;

        streakText.textContent =
            "STREAK: " + streak;

        darkOverlay.style.display = "block";

        gameOverMenu.style.display = "flex";
    }


    /* GAME LOOP */

    function updateGame() {

        if (!gameRunning) return;

        const playerRect =
            player.getBoundingClientRect();

        /* MOVE BULLETS */

        for (let i = bullets.length - 1; i >= 0; i--) {

            const bullet = bullets[i];

            bullet.x += 8;

            bullet.element.style.left =
                bullet.x + "px";


            if (bullet.x > gameArea.clientWidth + 50) {

                bullet.element.remove();

                bullets.splice(i, 1);

                continue;
            }


            /* BULLET / ENEMY */

            for (let j = enemies.length - 1; j >= 0; j--) {

                const enemy = enemies[j];

                if (
                    isColliding(
                        bullet.element,
                        enemy.element
                    )
                ) {

                    enemy.element.remove();
                    bullet.element.remove();

                    enemies.splice(j, 1);
                    bullets.splice(i, 1);

                    kills++;
                    streak++;

                    killsText.textContent =
                        "KILLS: " + kills;

                    streakText.textContent =
                        "STREAK: " + streak;


                    /* STREAK 25+ */

                    if (streak >= 25) {

                        streakText.classList.add("hot");

                        player.style.background =
                            "#c96b6b";

                        document
                            .querySelectorAll(".bullet")
                            .forEach(function (b) {
                                b.style.background =
                                    "#ff0000";
                            });

                    }

                    break;
                }
            }
        }


        /* MOVE ENEMIES */

        for (let i = enemies.length - 1; i >= 0; i--) {

            const enemy = enemies[i];

            enemy.x -= enemy.speed;

            enemy.element.style.left =
                enemy.x + "px";


            /* PLAYER COLLISION */

            if (
                isColliding(
                    player,
                    enemy.element
                )
            ) {

                enemy.element.remove();

                enemies.splice(i, 1);

                gameOver();

                return;
            }


            /* ENEMY REACHED LEFT SIDE */

            if (enemy.x < -60) {

                enemy.element.remove();

                enemies.splice(i, 1);

                /*
                    Missing an enemy resets streak,
                    but keeps kills.
                */
                streak = 0;

                streakText.textContent =
                    "STREAK: " + streak;

                streakText.classList.remove("hot");

                player.style.background =
                    "#b8b8b8";
            }
        }


        gameLoop =
            requestAnimationFrame(updateGame);
    }


    /* START */

    function startGame() {

        gameRunning = true;

        kills = 0;
        streak = 0;

        playerY = 50;

        killsText.textContent =
            "KILLS: 0";

        streakText.textContent =
            "STREAK: 0";

        streakText.classList.remove("hot");

        player.style.background =
            "#b8b8b8";

        player.style.top =
            "50%";

        startMenu.style.display =
            "none";

        gameOverMenu.style.display =
            "none";

        darkOverlay.style.display =
            "none";


        /* Clear old objects */

        enemies.forEach(function (enemy) {
            enemy.element.remove();
        });

        bullets.forEach(function (bullet) {
            bullet.element.remove();
        });

        enemies = [];
        bullets = [];


        clearInterval(enemyTimer);

        enemyTimer = setInterval(
            createEnemy,
            1200
        );

        gameLoop =
            requestAnimationFrame(updateGame);
    }


    startButton.addEventListener(
        "click",
        startGame
    );

    restartButton.addEventListener(
        "click",
        startGame
    );


    /* CODE BUTTON */

    codeCheck.addEventListener("click", function () {

        const code =
            codeInput.value.trim();

        if (code === "") return;

        /*
            Code system can be added here.
            The entered code is currently accepted
            without changing the game.
        */

        codeInput.value = "";

    });


    /* ENTER TO SUBMIT CODE */

    codeInput.addEventListener("keydown", function (event) {

        if (event.key === "Enter") {
            codeCheck.click();
        }

    });

</script>

</body>
</html>
