<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaks - SlimeManMillerVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 300vh;
            font-family: Arial, sans-serif;
            background: #5f9f55;
        }

        /* TOP */
        .top {
            height: 35vh;
            min-height: 300px;

            background: linear-gradient(
                to bottom,
                #205f2c 0%,
                #286b32 25%,
                #3f833f 55%,
                #5f9f55 100%
            );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            color: black;
            font-size: 42px;
            font-weight: bold;
        }

        /* CONTENT */
        .content {
            min-height: 230vh;
            padding: 50px 40px;
        }

        .section-title {
            color: black;
            font-size: 32px;
            font-weight: bold;
            text-align: left;
        }

        /* OTHER LEAKS */
        .other-leaks {
            margin-top: 55px;
        }

        .other-leaks-title {
            color: black;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        /* PHOTOS */
        .leak-items {
            display: flex;
            align-items: flex-start;
            gap: 40px;
        }

        .leak-photo {
            width: 300px;
            height: auto;
            object-fit: contain;
        }

        /* BACK BUTTON */
        .back-container {
            display: flex;
            justify-content: center;
            padding: 60px 0;
        }

        .back-button {
            width: 280px;
            height: 140px;

            background: #718b78;
            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 28px;
            font-weight: bold;
            text-decoration: none;

            cursor: pointer;

            transition:
                transform 0.2s,
                background 0.2s;
        }

        .back-button:hover {
            transform: scale(1.05);
            background: #809b87;
        }

        /* BOTTOM */
        .bottom {
            height: 35vh;
            min-height: 300px;

            background: linear-gradient(
                to bottom,
                #5f9f55 0%,
                #3f833f 45%,
                #286b32 75%,
                #205f2c 100%
            );
        }
    </style>
</head>

<body>

    <!-- TOP -->
    <div class="top">
        <div class="title">
            LEAKS
        </div>
    </div>


    <!-- CONTENT -->
    <div class="content">

        <div class="section-title">
            LEAKS:
        </div>

        <!-- OTHER LEAKS -->
        <div class="other-leaks">

            <div class="other-leaks-title">
                OTHER LEAKS:
            </div>

            <div class="leak-items">

                <!-- LEFT PHOTO -->
                <img
                    class="leak-photo"
                    src="tt.png"
                    alt="Gate Leak"
                >

                <!-- RIGHT PHOTO -->
                <img
                    class="leak-photo"
                    src="tq.png"
                    alt="Controller Leak"
                >

            </div>

        </div>

    </div>


    <!-- BACK BUTTON -->
    <div class="back-container">
        <a
            class="back-button"
            href="index.html"
        >
            BACK
        </a>
    </div>


    <!-- BOTTOM -->
    <div class="bottom"></div>

</body>
</html>
