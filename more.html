<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>More - SlimeManMillerVR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 160vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                to bottom,
                #205f2c 0%,
                #286b32 15%,
                #3f833f 40%,
                #5f9f55 70%,
                #3f833f 88%,
                #286b32 100%
            );
        }

        .page {
            min-height: 160vh;
            padding: 35px;
            position: relative;
        }

        /* TITLE */
        .title {
            color: black;
            font-size: 42px;
            font-weight: bold;
            text-align: center;
        }

        /* SECTION TITLES */
        .section-title {
            color: black;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        /* VIDEO LINKS */
        .video-list {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 18px;
        }

        .video-link {
            color: black;
            font-size: 23px;
            font-weight: bold;
            text-decoration: none;
        }

        .video-link:hover {
            text-decoration: underline;
        }

        /* ALL VIDS + GAME */
        .extra-button {
            width: 230px;
            height: 75px;

            background: #4f5a52;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 24px;
            font-weight: bold;

            text-decoration: none;

            transition:
                transform 0.2s,
                background 0.2s;
        }

        .extra-button:hover {
            transform: scale(1.05);
            background: #5d6961;
        }

        /* ALL VIDS */
        .all-vids-button {
            margin-top: 45px;
        }

        /* GAME */
        .game-button {
            margin-top: 25px;
        }

        /* BACK */
        .back-button {
            position: absolute;

            left: 35px;
            bottom: 35px;

            width: 150px;
            height: 60px;

            background: #4f5a52;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 22px;
            font-weight: bold;

            text-decoration: none;

            transition:
                transform 0.2s,
                background 0.2s;
        }

        .back-button:hover {
            transform: scale(1.05);
            background: #5d6961;
        }
    </style>
</head>
